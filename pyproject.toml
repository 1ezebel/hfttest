[project]
name = "hftlab"
version = "0.1.0"
description = "Учебная лаборатория: запись рыночных данных OKX, стакан, исследование mean reversion"
requires-python = ">=3.11"
dependencies = ["websockets>=13", "numpy", "pandas>=2", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
