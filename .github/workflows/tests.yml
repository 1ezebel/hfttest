# Запускает все тесты при каждом изменении кода.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # та же версия, что на компьютере пользователя
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
